<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<title>文件管理 | Telegraph-Image</title>
<script>
  // 尽早应用主题，避免闪白
  (function () {
    var t = localStorage.getItem('ti-theme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var a = localStorage.getItem('ti-accent');
    if (a && /^#[0-9a-f]{6}$/i.test(a)) {
      var st = document.documentElement.style;
      st.setProperty('--accent', a);
      st.setProperty('--accent-2', 'color-mix(in srgb, ' + a + ' 78%, #fff)');
      st.setProperty('--accent-soft', 'color-mix(in srgb, ' + a + ' 13%, transparent)');
    }
  })();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6bff">
<style>
:root {
  --bg: #f4f6fa; --panel: #ffffff; --panel-2: #f8f9fc; --line: #e6e9f0; --line-2: #eef0f5;
  --ink: #1d2433; --body: #4a5568; --muted: #8b95a7;
  --accent: #2f6bff; --accent-2: #5b8cff; --accent-soft: rgba(47,107,255,.10);
  --ok: #12a37f; --warn: #d98a00; --err: #e5484d; --pink: #e0457b;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 24px rgba(16,24,40,.06);
  --radius: 14px;
  --video: #7c4dff; --image: #12a37f; --audio: #e08a00; --doc: #64748b;
}
[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b23; --panel-2: #1c212b; --line: #272d39; --line-2: #222833;
  --ink: #eef1f6; --body: #b7bfcd; --muted: #7d8799;
  --accent: #5b8cff; --accent-2: #7aa2ff; --accent-soft: rgba(91,140,255,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  --video: #a68bff; --image: #34c79e; --audio: #f0a53a; --doc: #94a3b8;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--body);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
.icon { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  backdrop-filter: saturate(160%) blur(12px); -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .in { max-width: 1320px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 800; font-size: 16px; white-space: nowrap; }
.logo .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--accent), #8b5cf6); box-shadow: 0 4px 12px rgba(47,107,255,.3); }
.logo small { font-weight: 500; color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.nav { display: flex; gap: 6px; align-items: center; }
.iconbtn, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--body); cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, transform .1s;
}
.iconbtn { width: 34px; padding: 0; }
.iconbtn:hover, .btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--ink); }
.btn:active, .iconbtn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.danger { color: var(--err); }
.btn.danger:hover { border-color: var(--err); background: color-mix(in srgb, var(--err) 8%, var(--panel)); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 9px; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 20px; }

/* ---------- 统计 ---------- */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color .15s; }
.stat:hover, .stat.on { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.stat .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.stat .ic .icon { width: 19px; height: 19px; }
.stat b { display: block; color: var(--ink); font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* ---------- 筛选面板 ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.filters { padding: 14px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; flex: 1 1 280px; min-width: 200px; }
.search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.input, select.input {
  height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
  padding: 0 11px; outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0;
}
.search .input { width: 100%; padding-left: 34px; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--panel); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 11px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(16,24,40,.12); }
[data-theme="dark"] .seg button.on { background: #262c38; }
.size { display: flex; align-items: center; gap: 6px; }
.size .input { width: 84px; }
.size select.input { width: 66px; padding: 0 6px; }
.label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; white-space: nowrap; }
.toggle input { display: none; }
.toggle .sw { width: 34px; height: 20px; border-radius: 20px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.toggle .sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.toggle input:checked + .sw { background: var(--accent); }
.toggle input:checked + .sw::after { transform: translateX(14px); }
.hint { font-size: 12px; color: var(--muted); }
.hint.warn { color: var(--warn); }
.hint a { cursor: pointer; }

/* ---------- 批量操作条 ---------- */
.bulk { position: sticky; top: 59px; z-index: 20; margin: 14px 0; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bulk .count { font-weight: 700; color: var(--ink); margin-right: 4px; white-space: nowrap; }
.bulk .count em { font-style: normal; color: var(--accent); }
.bulk .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.bulk select.input { height: 30px; font-size: 13px; padding: 0 8px; }

/* ---------- 列表 ---------- */
.list { overflow: hidden; }
.thead, .item { display: grid; grid-template-columns: 40px 72px minmax(0,1fr) 92px 150px 210px; align-items: center; gap: 12px; padding: 10px 14px; }
.thead { font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel-2); }
.thead .sortable { cursor: pointer; user-select: none; }
.thead .sortable:hover { color: var(--ink); }
.thead .sortable.on { color: var(--accent); font-weight: 600; }
.item { border-bottom: 1px solid var(--line-2); transition: background .12s; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--panel-2); }
.item.sel { background: var(--accent-soft); }
.cb { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.thumb { width: 72px; height: 50px; border-radius: 9px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line);
  display: grid; place-items: center; position: relative; cursor: pointer; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { display: grid; place-items: center; gap: 2px; font-size: 10px; font-weight: 700; letter-spacing: .3px; }
.thumb .ph .icon { width: 20px; height: 20px; }
.thumb .play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.18); color: #fff; pointer-events: none; }
.name { min-width: 0; }
.name .t { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: 6px; }
.tag.video { color: var(--video); background: color-mix(in srgb, var(--video) 14%, transparent); }
.tag.image { color: var(--image); background: color-mix(in srgb, var(--image) 14%, transparent); }
.tag.audio { color: var(--audio); background: color-mix(in srgb, var(--audio) 14%, transparent); }
.tag.doc { color: var(--doc); background: color-mix(in srgb, var(--doc) 16%, transparent); }
.tag.block { color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); }
.tag.white { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.tag.nsfw { color: var(--pink); background: color-mix(in srgb, var(--pink) 12%, transparent); }
.num { font-variant-numeric: tabular-nums; color: var(--body); font-size: 13px; white-space: nowrap; }
.ops { display: flex; gap: 4px; justify-content: flex-end; }
.op { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; transition: background .12s, color .12s; }
.op:hover { background: var(--accent-soft); color: var(--accent); }
.op.del:hover { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
.op.liked { color: var(--pink); }
.op .icon { width: 16px; height: 16px; }

/* 网格视图 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); position: relative; transition: border-color .15s, box-shadow .15s; }
.card:hover { box-shadow: var(--shadow); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card .thumb { width: 100%; height: 140px; border-radius: 0; border: 0; border-bottom: 1px solid var(--line); }
.card .thumb .ph .icon { width: 30px; height: 30px; }
.card .cb { position: absolute; top: 9px; left: 9px; z-index: 2; }
.card .body { padding: 9px 11px 6px; }
.card .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.card .ops { justify-content: space-between; padding: 0 6px 6px; }
.card .t { font-size: 13px; }

.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty .icon { width: 40px; height: 40px; margin-bottom: 8px; opacity: .6; }

/* 分页 */
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.pages { display: flex; gap: 4px; flex-wrap: wrap; }
.pages button { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.pages button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.pages button[disabled] { opacity: .4; cursor: default; }

/* 弹层 */
.mask { position: fixed; inset: 0; background: rgba(10,14,22,.55); z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; }
.mask.show { display: flex; }
.dialog { width: min(720px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--panel); border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.3); }
.dialog header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.dialog header h3 { margin: 0; font-size: 15px; color: var(--ink); flex: 1; }
.dialog .content { padding: 14px 16px; overflow: auto; display: grid; gap: 12px; }
.dialog footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dialog textarea { width: 100%; min-height: 240px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 10px;
  font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--body); white-space: pre; outline: none; }
.preview-media { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto; border-radius: 10px; background: #000; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; color: var(--ink); }

/* 提示 */
#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); background: rgba(20,24,34,.95); color: #fff;
  padding: 10px 18px; border-radius: 30px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 90; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: #c43237; }
.loading { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 响应式 ---------- */
@media (max-width: 1080px) {
  .thead, .item { grid-template-columns: 36px 64px minmax(0,1fr) 84px 180px; }
  .col-time { display: none; }
}
@media (max-width: 760px) {
  .wrap { padding: 12px; }
  .topbar .in { padding: 10px 12px; gap: 8px; }
  .logo small, .nav .txt { display: none; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 10px; gap: 8px; }
  .stat .ic { display: none; }
  .stat b { font-size: 17px; }
  .stat.size-stat, .stat.audio-stat { display: none; }
  .thead { display: none; }
  .item { grid-template-columns: 30px 64px minmax(0,1fr); grid-template-areas: "cb th nm" "op op op"; gap: 8px 10px; padding: 10px 12px; }
  .item > .c-cb { grid-area: cb; } .item > .thumb { grid-area: th; } .item > .name { grid-area: nm; }
  .item > .col-size, .item > .col-time { display: none; }
  .item > .ops { grid-area: op; justify-content: flex-start; }
  .name .s.mobile-meta { display: block; }
  .bulk { position: static; }
  .bulk .sep { display: none; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
  .card .thumb { height: 110px; }
  .size .input { width: 70px; }
}
.name .s.mobile-meta { display: none; }
@media (max-width: 760px) { .name .s.mobile-meta { display: block; } }
/* ================= 视觉精修 v2 ================= */
body {
  background:
    radial-gradient(1200px 420px at 10% -120px, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    radial-gradient(900px 380px at 95% -160px, rgba(139, 92, 246, .16), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
}
.topbar { background: color-mix(in srgb, var(--panel) 72%, transparent); }
.topbar .btn, .topbar .iconbtn { background: color-mix(in srgb, var(--panel) 70%, transparent); }
.logo .mark { width: 34px; height: 34px; border-radius: 11px; }

.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 18px; flex-wrap: wrap; }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.2; color: var(--ink); letter-spacing: -.3px; font-weight: 800; }
.hero p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.hero .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 20px; font-size: 12px;
  background: color-mix(in srgb, var(--panel) 75%, transparent); border: 1px solid var(--line); color: var(--body); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.chip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }

.stat { position: relative; overflow: hidden; padding: 16px 18px; border-radius: 16px; transition: transform .15s, box-shadow .15s, border-color .15s;
  background: linear-gradient(160deg, var(--panel) 55%, color-mix(in srgb, var(--c, var(--accent)) 7%, var(--panel))); }
.stat::after { content: ''; position: absolute; right: -26px; top: -26px; width: 90px; height: 90px; border-radius: 50%;
  background: color-mix(in srgb, var(--c, var(--accent)) 10%, transparent); pointer-events: none; }
.stat:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16,24,40,.10); }
.stat.on { border-color: color-mix(in srgb, var(--c, var(--accent)) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--accent)) 14%, transparent); }
.stat .ic { width: 42px; height: 42px; border-radius: 13px; }
.stat b { font-size: 22px; letter-spacing: -.3px; }
.stat[data-type="all"] { --c: var(--accent); } .stat[data-type="video"] { --c: var(--video); }
.stat[data-type="image"] { --c: var(--image); } .stat[data-type="other"] { --c: var(--doc); } .stat.size-stat { --c: var(--audio); }

.panel { border-radius: 16px; }
.filters { padding: 16px; gap: 14px; }
.search .input { height: 42px; border-radius: 12px; font-size: 14px; }
.search .icon { width: 18px; height: 18px; }
.seg button.on { background: var(--panel); }
.seg#type-seg button { height: 34px; padding: 0 14px; }

.bulk { backdrop-filter: saturate(160%) blur(10px); -webkit-backdrop-filter: saturate(160%) blur(10px);
  background: color-mix(in srgb, var(--panel) 88%, transparent); }
.bulk.has-sel { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }

.list { padding: 0; }
.thead { background: transparent; text-transform: none; letter-spacing: .2px; padding-top: 12px; padding-bottom: 12px; }
.item { margin: 0 8px; border-radius: 12px; border-bottom: 0; position: relative; }
.item + .item::before { content: ''; position: absolute; left: 12px; right: 12px; top: 0; height: 1px; background: var(--line-2); }
.item:hover::before, .item:hover + .item::before, .item.sel::before, .item.sel + .item::before { opacity: 0; }
.item .ops .op { opacity: .55; }
.item:hover .ops .op, .item.sel .ops .op, .card .ops .op { opacity: 1; }
.item .ops .op.liked { opacity: 1; }
.list > .item:first-of-type { margin-top: 6px; }
.thumb { border-radius: 10px; border: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 8%, transparent); }
.thumb[data-kind] { background: linear-gradient(140deg, color-mix(in srgb, var(--k) 22%, var(--panel)), color-mix(in srgb, var(--k) 6%, var(--panel))); color: var(--k); }
.thumb[data-kind="video"] { --k: var(--video); } .thumb[data-kind="audio"] { --k: var(--audio); }
.thumb[data-kind="doc"] { --k: var(--doc); } .thumb[data-kind="image"] { --k: var(--image); }
.thumb img { transition: transform .3s; }
.item:hover .thumb img, .card:hover .thumb img { transform: scale(1.06); }
.name .t { font-size: 14px; }
.name .s { margin-top: 2px; }

.grid { gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.card { border-radius: 14px; transition: transform .15s, box-shadow .15s, border-color .15s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(16,24,40,.12); }
.card .thumb { height: 150px; box-shadow: none; }
.card .thumb[data-kind] .ph .icon { width: 36px; height: 36px; }
.card .cb { opacity: 0; transition: opacity .15s; box-shadow: 0 1px 4px rgba(0,0,0,.25); border-radius: 4px; }
.card:hover .cb, .card.sel .cb, .grid.selecting .card .cb { opacity: 1; }
.card .body { padding: 11px 12px 6px; }
.card .ops { border-top: 1px solid var(--line-2); padding: 6px; margin-top: 4px; }

.pager { border-top: 1px solid var(--line-2); }
.pages button { border-radius: 9px; }
.empty { padding: 72px 20px; }
.empty .icon { width: 48px; height: 48px; padding: 12px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); opacity: 1; box-sizing: content-box; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin: 6px 0 4px; }

.dialog { border-radius: 18px; animation: pop .16s ease-out; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.mask { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

[data-theme="dark"] .stat:hover, [data-theme="dark"] .card:hover { box-shadow: 0 14px 34px rgba(0,0,0,.4); }
[data-theme="dark"] body {
  background:
    radial-gradient(1200px 420px at 10% -120px, rgba(91,140,255,.18), transparent 70%),
    radial-gradient(900px 380px at 95% -160px, rgba(139,92,246,.18), transparent 70%),

}
/* ================= 交互增强 v3 ================= */
/* 骨架屏与图片渐显 */
.sk { background: linear-gradient(90deg, var(--panel-2) 25%, color-mix(in srgb, var(--line) 70%, var(--panel-2)) 50%, var(--panel-2) 75%);
  background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; border-radius: 8px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.sk-row { display: grid; grid-template-columns: 36px 72px 1fr 120px; gap: 14px; align-items: center; padding: 12px 18px; }
.sk-row .a { height: 16px; width: 16px; } .sk-row .b { height: 50px; } .sk-row .c { height: 14px; } .sk-row .c + .c { width: 60%; margin-top: 8px; }
.thumb img { opacity: 0; }
.thumb img.ld { opacity: 1; transition: opacity .35s, transform .3s; }
/* 瀑布流 */
.masonry { columns: 220px; column-gap: 14px; padding: 14px; }
.masonry .tile { break-inside: avoid; margin: 0 0 14px; position: relative; border-radius: 12px; overflow: hidden; background: var(--panel-2);
  border: 1px solid var(--line); cursor: zoom-in; transition: transform .15s, box-shadow .15s; }
.masonry .tile:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(16,24,40,.14); }
.masonry .tile img { width: 100%; display: block; opacity: 0; min-height: 60px; }
.masonry .tile img.ld { opacity: 1; transition: opacity .35s; }
.masonry .tile .ph { height: 140px; display: grid; place-items: center; align-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--k, var(--muted));
  background: linear-gradient(140deg, color-mix(in srgb, var(--k, var(--doc)) 20%, var(--panel)), color-mix(in srgb, var(--k, var(--doc)) 5%, var(--panel))); }
.masonry .tile .ph .icon { width: 32px; height: 32px; }
.masonry .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; color: #fff; font-size: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masonry .tile:hover .cap, .masonry .tile.sel .cap { opacity: 1; }
.masonry .tile .cb { position: absolute; left: 8px; top: 8px; z-index: 2; opacity: 0; }
.masonry .tile:hover .cb, .masonry .tile.sel .cb, .masonry.selecting .tile .cb { opacity: 1; }
.masonry .tile.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 80; background: rgba(8,10,16,.94); display: none; flex-direction: column; color: #e8ecf3; }
.lb.show { display: flex; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.lb-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 13px; }
.lb-top .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-top .t small { color: #98a2b3; margin-left: 8px; }
.lb .lbb { height: 34px; min-width: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
  color: #e8ecf3; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.lb .lbb:hover { background: rgba(255,255,255,.14); }
.lb-stage { flex: 1; position: relative; overflow: hidden; display: grid; place-items: center; touch-action: none; }
.lb-stage img, .lb-stage video { max-width: 94vw; max-height: calc(100vh - 140px); object-fit: contain; user-select: none; -webkit-user-drag: none; transition: transform .12s; border-radius: 4px; }
.lb-stage img { cursor: zoom-in; } .lb-stage.zoomed img { cursor: grab; transition: none; }
.lb-stage .ph { text-align: center; color: #98a2b3; } .lb-stage .ph .icon { width: 64px; height: 64px; display: block; margin: 0 auto 12px; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; z-index: 2;
  background: rgba(255,255,255,.1); color: #fff; font-size: 24px; display: grid; place-items: center; }
.lb-nav:hover { background: rgba(255,255,255,.2); } .lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }
.lb-bot { padding: 10px 16px 14px; text-align: center; font-size: 12px; color: #98a2b3; }
/* 右键菜单 */
.ctx { position: fixed; z-index: 90; min-width: 190px; padding: 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 16px 40px rgba(16,24,40,.22); display: none; font-size: 13px; }
.ctx.show { display: block; animation: pop .12s ease-out; }
.ctx button { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--body); text-align: left; }
.ctx button:hover { background: var(--accent-soft); color: var(--ink); }
.ctx button.danger { color: var(--err); }
.ctx button kbd { margin-left: auto; }
.ctx hr { border: 0; border-top: 1px solid var(--line-2); margin: 5px 4px; }
.ctx .h { padding: 4px 10px 6px; color: var(--muted); font-size: 12px; }
kbd { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); }
/* 框选 */
.lasso { position: fixed; z-index: 70; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 4px; pointer-events: none; }
body.lassoing { user-select: none; -webkit-user-select: none; }
/* 重复文件 */
.tag.dup { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.dup-head { padding: 10px 18px 4px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; border-top: 1px dashed var(--line); margin-top: 4px; }
.dup-head:first-of-type { border-top: 0; }
.dup-head b { color: var(--ink); }
/* 设置 */
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
.swatches button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; font-size: 13px; }
@media (max-width: 760px) {
  .masonry { columns: 2; column-gap: 8px; padding: 8px; } .masonry .tile { margin-bottom: 8px; }
  .masonry .tile .cb { opacity: 1; }
  .lb-nav { width: 38px; height: 38px; } .lb-nav.prev { left: 6px; } .lb-nav.next { right: 6px; }
  .lb-top .lbb .txt { display: none; }
}
</style>

      <span class="label" style="margin-left:6px">排序</span>
      <select class="input" id="sort">
        <option value="time-desc">上传时间 · 新→旧</option><option value="time-asc">上传时间 · 旧→新</option>
        <option value="name-asc">文件名 · A→Z</option><option value="name-desc">文件名 · Z→A</option>
        <option value="size-desc">文件大小 · 大→小</option><option value="size-asc">文件大小 · 小→大</option>

      <div class="spacer"></div>

      <div class="seg" id="view-seg"><button data-v="list" class="on" title="列表"><svg class="icon"><use href="#i-list"/></svg></button><button data-v="grid" title="网格"><svg class="icon"><use href="#i-grid"/></svg></button><button data-v="masonry" title="瀑布流"><svg class="icon"><use href="#i-masonry"/></svg></button></div>

    <div class="row">

      <div class="spacer"></div>
      <button class="btn sm" id="btn-dup" title="查找内容相同或同名同大小的文件"><svg class="icon"><use href="#i-dup"/></svg>重复文件</button>
      <button class="btn sm primary" id="btn-dup-pick" hidden title="每组保留一份（优先收藏/白名单，其次最早上传），选中其余副本">选中多余副本</button>
      <button class="btn sm" id="btn-reset">清空筛选</button>
      <button class="btn sm" id="btn-more" hidden>加载下一批</button>

    </div>
  </section>

  <section class="panel bulk" id="bulk">
    <span class="count">已选 <em id="sel-count">0</em> / <span id="match-count">0</span></span>
    <button class="btn sm" id="sel-page">全选本页</button>
    <button class="btn sm" id="sel-all">全选筛选结果</button>

      <option value="url">纯 URL</option><option value="markdown">Markdown</option><option value="html">HTML</option><option value="bbcode">BBCode</option>
    </select>
    <button class="btn sm primary" id="copy-sel"><svg class="icon"><use href="#i-copy"/></svg>复制地址</button>
    <button class="btn sm" id="export-btn"><svg class="icon"><use href="#i-down"/></svg>导出</button>
    <span class="sep"></span>
    <button class="btn sm" id="b-like"><svg class="icon"><use href="#i-heart"/></svg>收藏</button>
    <button class="btn sm" id="b-white"><svg class="icon"><use href="#i-check"/></svg>白名单</button>
    <button class="btn sm" id="b-block"><svg class="icon"><use href="#i-ban"/></svg>黑名单</button>
    <button class="btn sm danger" id="b-delete"><svg class="icon"><use href="#i-trash"/></svg>删除</button>
  </section>

  <section class="panel list" id="list"></section>

<div class="mask" id="mask"><div class="dialog" role="dialog" aria-modal="true">
  <header><h3 id="dlg-title"></h3><button class="iconbtn" id="dlg-close" title="关闭"><svg class="icon"><use href="#i-x"/></svg></button></header>
  <div class="content" id="dlg-body"></div>

</div></div>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top"><div class="t" id="lb-title"></div>
    <button class="lbb" id="lb-copy" title="复制地址 (C)"><svg class="icon"><use href="#i-copy"/></svg><span class="txt">复制</span></button>
    <button class="lbb" id="lb-open" title="新窗口打开"><svg class="icon"><use href="#i-open"/></svg><span class="txt">打开</span></button>
    <button class="lbb" id="lb-info" title="详情"><svg class="icon"><use href="#i-info"/></svg></button>
    <button class="lbb" id="lb-close" title="关闭 (Esc)"><svg class="icon"><use href="#i-x"/></svg></button></div>

  <div class="lb-bot" id="lb-bot"></div>
</div>
<div class="ctx" id="ctx"></div>

<script>
(function () {
  'use strict';

  // ================= 常量与状态 =================
  var EXT = {
    image: ['jpg','jpeg','png','gif','webp','bmp','tiff','tif','ico','avif','apng','svg','heic'],
    video: ['mp4','webm','ogv','avi','mov','wmv','flv','mkv','m4v','3gp','ts','m3u8'],
    audio: ['mp3','wav','ogg','oga','flac','aac','m4a','wma','opus']
  };
  var TYPE_LABEL = { image: '图片', video: '视频', audio: '音频', doc: '其他' };
  var TYPE_ICON = { image: 'i-image', video: 'i-video', audio: 'i-audio', doc: 'i-doc' };
  var PAGE_SIZES = [30, 60, 120, 240];
  var BATCH_LIMIT = 1000;      // /api/manage/list 单次最大 1000
  var ORIGIN = location.origin;

  var store = load('ti-admin', {});
  var state = {
    items: [],            // 已加载的所有文件
    cursor: null,
    complete: false,
    loading: false,
    selected: new Set(),
    renames: 0,
    q: '',
    type: store.type || 'all',
    status: 'all',
    sort: store.sort || 'time-desc',
    minSize: '', maxSize: '', unit: store.unit || '1048576',
    view: ['list', 'grid', 'masonry'].indexOf(store.view) > -1 ? store.view : (innerWidth < 760 ? 'grid' : 'list'),
    previewVideo: !!store.previewVideo,
    fmt: store.fmt || 'url',
    page: 1,
    pageSize: store.pageSize || 60,
    batchApi: true        // 不支持 /api/manage/batch（旧部署）时自动回退到逐个请求
  };

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    list: $('list'), q: $('q'), status: $('status'), sort: $('sort'), min: $('min-size'), max: $('max-size'), unit: $('size-unit'),
    preview: $('preview-video'), fmt: $('fmt'), hint: $('load-hint'), more: $('btn-more'), all: $('btn-all'),
    selCount: $('sel-count'), matchCount: $('match-count')
  };

  // ================= 工具函数 =================
  function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; } }
  function persist() {
    localStorage.setItem('ti-admin', JSON.stringify({
      type: state.type, sort: state.sort, unit: state.unit, view: state.view,
      previewVideo: state.previewVideo, fmt: state.fmt, pageSize: state.pageSize
    }));
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtSize(b) {
    b = Number(b) || 0;
    if (b <= 0) return '—';
    var u = ['B','KB','MB','GB','TB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i === 0 ? b : b.toFixed(b >= 100 ? 0 : b >= 10 ? 1 : 2)) + ' ' + u[i];
  }
  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts), p = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function extOf(name) { var m = /\.([a-z0-9]+)$/i.exec(String(name || '')); return m ? m[1].toLowerCase() : ''; }
  function typeOf(item) {
    var mime = (item.metadata.fileType || '').toLowerCase();
    if (mime.indexOf('video/') === 0) return 'video';
    if (mime.indexOf('image/') === 0) return 'image';
    if (mime.indexOf('audio/') === 0) return 'audio';
    var exts = [extOf(item.name), extOf(item.metadata.fileName)];
    for (var i = 0; i < exts.length; i++) {
      var e = exts[i];
      if (!e) continue;
      if (EXT.video.indexOf(e) > -1) return 'video';
      if (EXT.image.indexOf(e) > -1) return 'image';
      if (EXT.audio.indexOf(e) > -1) return 'audio';
    }
    return 'doc';
  }
  function fileUrl(item) { return ORIGIN + '/file/' + (item.metadata.shortId || item.name); }
  function rawSrc(item) { return '/file/' + encodeURIComponent(item.name); }
  function displayName(item) { return item.metadata.fileName || item.name; }

  function formatLink(item, fmt) {
    var url = fileUrl(item), name = displayName(item), t = item.type;
    switch (fmt) {
      case 'markdown':
        return t === 'image' ? '![' + name + '](' + url + ')' : '[' + name + '](' + url + ')';
      case 'html':
        if (t === 'image') return '<img src="' + url + '" alt="' + esc(name) + '">';
        if (t === 'video') return '<video src="' + url + '" controls preload="metadata"></video>';
        if (t === 'audio') return '<audio src="' + url + '" controls></audio>';
        return '<a href="' + url + '">' + esc(name) + '</a>';
      case 'bbcode':
        if (t === 'image') return '[img]' + url + '[/img]';
        if (t === 'video') return '[video]' + url + '[/video]';
        return '[url=' + url + ']' + name + '[/url]';
      default: return url;
    }
  }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, 2200);
  }
  function copyText(text, okMsg) {
    var done = function () { toast(okMsg || '已复制到剪贴板'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) done(); else showText('复制失败，请手动复制', text);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function api(path, opts) {
    opts = opts || {};
    opts.credentials = 'include';
    return fetch(path, opts).then(function (res) {
      if (res.status === 401) { location.href = './api/manage/login'; throw new Error('未登录'); }
      return res;
    });
  }

  // ================= 数据加载 =================
  function normalize(key) {
    var m = key.metadata || {};
    var item = {
      name: key.name,
      metadata: {
        TimeStamp: m.TimeStamp || 0,
        ListType: m.ListType || 'None',
        Label: m.Label || 'None',
        liked: !!m.liked,
        fileName: m.fileName || key.name,
        fileSize: Number(m.fileSize) || 0,
        shortId: m.shortId,
        fileType: m.fileType,
        fileHash: m.fileHash,
        provider: m.provider
      }
    };
    item.type = typeOf(item);
    item.search = (item.metadata.fileName + ' ' + item.name + ' ' + (item.metadata.shortId || '')).toLowerCase();
    return item;
  }

  function fetchBatch() {
    if (state.loading || state.complete) return Promise.resolve();
    state.loading = true; renderHint();
    var url = './api/manage/list?limit=' + BATCH_LIMIT + (state.cursor ? '&cursor=' + encodeURIComponent(state.cursor) : '');
    return api(url).then(function (r) { return r.json(); }).then(function (data) {
      var seen = {};
      state.items.forEach(function (i) { seen[i.name] = true; });
      (data.keys || []).forEach(function (k) { if (!seen[k.name]) state.items.push(normalize(k)); });
      state.cursor = data.cursor || null;
      state.complete = !!data.list_complete || !data.cursor;
    }).catch(function (e) {
      toast('加载列表失败：' + e.message, true);
    }).then(function () {
      state.loading = false; render();
    });
  }
  function fetchAll() {
    if (state.complete) return Promise.resolve();
    return fetchBatch().then(function () { if (!state.complete) return fetchAll(); });
  }
  function reload() {
    state.items = []; state.cursor = null; state.complete = false; state.selected.clear();
    return fetchBatch();
  }

  // ================= 筛选 / 排序 =================
  function parseQuery(q) {
    var inc = [], exc = [];
    q.toLowerCase().split(/\s+/).forEach(function (w) {
      if (!w) return;
      if (w[0] === '-' && w.length > 1) exc.push(w.slice(1)); else inc.push(w);
    });
    return { inc: inc, exc: exc };
  }
  // ---- 重复文件：优先按内容哈希（新上传文件），否则按 文件名+大小（疑似）----
  var dupVersion = -1;
  function dupKey(it) {
    if (it.metadata.fileHash) return 'h:' + it.metadata.fileHash + ':' + it.metadata.fileSize;
    if (!it.metadata.fileSize) return null;
    return 'n:' + displayName(it).toLowerCase() + '|' + it.metadata.fileSize;
  }
  function computeDups() {
    var sig = state.items.length + ':' + (state.items[0] && state.items[0].name) + ':' + state.renames;
    if (sig === dupVersion) return; dupVersion = sig;
    var groups = {};
    state.items.forEach(function (it) {
      it.dupKey = dupKey(it); it.dupCount = 0;
      if (it.dupKey) (groups[it.dupKey] = groups[it.dupKey] || []).push(it);
    });
    // 哈希组与“同名同大小”组互相合并：同一文件的新旧两份记录（一份有哈希，一份没有）
    var byName = {};
    state.items.forEach(function (it) { if (it.metadata.fileSize) { var k = displayName(it).toLowerCase() + '|' + it.metadata.fileSize; (byName[k] = byName[k] || []).push(it); } });
    Object.keys(byName).forEach(function (k) {
      var g = byName[k]; if (g.length < 2) return;
      var withHash = g.filter(function (i) { return i.metadata.fileHash; });
      var hashes = {}; withHash.forEach(function (i) { hashes[i.metadata.fileHash] = 1; });
      if (Object.keys(hashes).length === 1) { var target = withHash[0].dupKey; g.forEach(function (i) { if (!i.metadata.fileHash) i.dupKey = target; }); }
    });
    var count = {};
    state.items.forEach(function (it) { if (it.dupKey) count[it.dupKey] = (count[it.dupKey] || 0) + 1; });
    state.items.forEach(function (it) { it.dupCount = it.dupKey ? count[it.dupKey] : 0; it.dupExact = /^h:/.test(it.dupKey || ''); });
  }
  function keepScore(it) { var m = it.metadata; return (m.liked ? 4 : 0) + (m.ListType === 'White' ? 2 : 0) + (m.ListType === 'Block' ? -4 : 0); }
  function filtered() {
    computeDups();
    var q = parseQuery(state.q), unit = Number(state.unit);
    var min = state.minSize === '' ? null : Number(state.minSize) * unit;
    var max = state.maxSize === '' ? null : Number(state.maxSize) * unit;
    var list = state.items.filter(function (it) {
      if (state.type !== 'all') {
        if (state.type === 'other' ? (it.type === 'image' || it.type === 'video') : it.type !== state.type) return false;
      }
      var m = it.metadata;
      switch (state.status) {
        case 'liked': if (!m.liked) return false; break;
        case 'block': if (m.ListType !== 'Block') return false; break;
        case 'white': if (m.ListType !== 'White') return false; break;
        case 'nsfw': if (String(m.Label).toLowerCase() !== 'adult') return false; break;
        case 'normal': if (m.ListType !== 'None' || String(m.Label).toLowerCase() === 'adult') return false; break;
        case 'dup': if (it.dupCount < 2) return false; break;
      }
      if (min !== null && m.fileSize < min) return false;
      if (max !== null && m.fileSize > max) return false;
      for (var i = 0; i < q.inc.length; i++) if (it.search.indexOf(q.inc[i]) === -1) return false;
      for (var j = 0; j < q.exc.length; j++) if (it.search.indexOf(q.exc[j]) > -1) return false;
      return true;
    });
    var s = state.sort, coll = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
    list.sort(function (a, b) {
      if (state.status === 'dup' && a.dupKey !== b.dupKey) return a.dupKey < b.dupKey ? -1 : 1;
      if (state.status === 'dup') return keepScore(b) - keepScore(a) || a.metadata.TimeStamp - b.metadata.TimeStamp;
      switch (s) {
        case 'time-asc': return a.metadata.TimeStamp - b.metadata.TimeStamp;
        case 'name-asc': return coll.compare(displayName(a), displayName(b));
        case 'name-desc': return coll.compare(displayName(b), displayName(a));
        case 'size-desc': return b.metadata.fileSize - a.metadata.fileSize;
        case 'size-asc': return a.metadata.fileSize - b.metadata.fileSize;
        default: return b.metadata.TimeStamp - a.metadata.TimeStamp;
      }
    });
    return list;
  }

  // ================= 渲染 =================
  var current = [];   // 当前筛选结果
  function render() {
    current = filtered();
    var pages = Math.max(1, Math.ceil(current.length / state.pageSize));
    if (state.page > pages) state.page = pages;
    var pageItems = current.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);

    renderStats();
    renderHint();
    syncControls();

    var html = '';
    if (!current.length && state.loading && !state.items.length) {
      html = state.view === 'list' ? new Array(8).join('<div class="sk-row"><div class="sk a"></div><div class="sk b"></div><div><div class="sk c"></div><div class="sk c"></div></div><div class="sk c"></div></div>')
        : '<div class="grid">' + new Array(11).join('<div class="sk" style="height:230px;border-radius:14px"></div>') + '</div>';
    } else if (!current.length) {
      html = '<div class="empty"><svg class="icon"><use href="#' + (state.items.length ? 'i-search' : 'i-files') + '"/></svg>' +
        (state.loading ? '<b><span class="loading"></span> 正在加载…</b>' : state.items.length ? '<b>没有符合条件的文件</b><div>试试换个关键字，或点「清空筛选」</div>' : '<b>还没有文件</b><div>去<a href="/">上传页</a>传一个试试</div>') + '</div>';
    } else if (state.view === 'grid') {
      html = '<div class="grid">' + pageItems.map(cardHtml).join('') + '</div>';
    } else if (state.view === 'masonry') {
      html = '<div class="masonry">' + pageItems.map(tileHtml).join('') + '</div>';
    } else {
      html = '<div class="thead"><div><input type="checkbox" class="cb" id="cb-page" title="全选本页"></div><div>预览</div>' +
        sortHead('name', '文件名') + '<div class="col-size">' + sortLabel('size', '大小') + '</div><div class="col-time">' + sortLabel('time', '上传时间') +
        '</div><div style="text-align:right">操作</div></div>' + pageItems.map(function (it, i) {
          var head = '';
          if (state.status === 'dup' && (i === 0 || pageItems[i - 1].dupKey !== it.dupKey)) {
            head = '<div class="dup-head"><b>' + esc(displayName(it)) + '</b> · ' + it.dupCount + ' 份 · ' + fmtSize(it.metadata.fileSize) + ' · ' +
              (it.dupExact ? '内容完全相同' : '同名同大小（疑似）') + '</div>';
          }
          return head + rowHtml(it);
        }).join('');
    }
    html += pagerHtml(pages);
    els.list.innerHTML = html;

    var cbPage = $('cb-page');
    if (cbPage) {
      var allSel = pageItems.length && pageItems.every(function (i) { return state.selected.has(i.name); });
      cbPage.checked = !!allSel;
      cbPage.indeterminate = !allSel && pageItems.some(function (i) { return state.selected.has(i.name); });
    }
    updateSelection();
  }
  function sortHead(key, label) { return '<div>' + sortLabel(key, label) + '</div>'; }
  function sortLabel(key, label) {
    var on = state.sort.indexOf(key) === 0, arrow = on ? (/desc$/.test(state.sort) ? ' ↓' : ' ↑') : '';
    return '<span class="sortable' + (on ? ' on' : '') + '" data-sort="' + key + '">' + label + arrow + '</span>';
  }
  var IMG_LD = ' onload="this.classList.add(\'ld\')" onerror="this.classList.add(\'ld\')"';
  function tileHtml(it) {
    var sel = state.selected.has(it.name), inner;
    if (it.type === 'image') inner = '<img loading="lazy" src="' + rawSrc(it) + '" alt=""' + IMG_LD + '>';
    else {
      var ext = (extOf(it.metadata.fileName) || extOf(it.name) || TYPE_LABEL[it.type]).toUpperCase();
      inner = '<div class="ph" style="--k:var(--' + it.type + ')"><svg class="icon"><use href="#' + TYPE_ICON[it.type] + '"/></svg>' + esc(ext.slice(0, 5)) + '</div>';
    }
    return '<div class="tile' + (sel ? ' sel' : '') + '" data-id="' + esc(it.name) + '" data-act="preview">' +
      '<input type="checkbox" class="cb" data-act="select"' + (sel ? ' checked' : '') + '>' + inner +
      '<div class="cap">' + esc(displayName(it)) + ' · ' + fmtSize(it.metadata.fileSize) + '</div></div>';
  }
  function thumbHtml(it) {
    var src = rawSrc(it);
    if (it.type === 'image') return '<div class="thumb" data-act="preview"><img loading="lazy" src="' + src + '" alt=""' + IMG_LD + '></div>';
    if (it.type === 'video' && state.previewVideo) {
      return '<div class="thumb" data-act="preview"><video src="' + src + '#t=0.5" preload="metadata" muted playsinline></video><span class="play"><svg class="icon"><use href="#i-play"/></svg></span></div>';
    }
    var ext = (extOf(it.metadata.fileName) || extOf(it.name) || TYPE_LABEL[it.type]).toUpperCase();
    return '<div class="thumb" data-act="preview" data-kind="' + it.type + '"><div class="ph"><svg class="icon"><use href="#' + TYPE_ICON[it.type] + '"/></svg>' + esc(ext.slice(0, 5)) + '</div></div>';
  }
  function tagsHtml(it) {
    var m = it.metadata, t = '<span class="tag ' + it.type + '">' + TYPE_LABEL[it.type] + '</span>';
    if (m.ListType === 'Block') t += '<span class="tag block">黑名单</span>';
    if (m.ListType === 'White') t += '<span class="tag white">白名单</span>';
    if (String(m.Label).toLowerCase() === 'adult') t += '<span class="tag nsfw">NSFW</span>';

  // ================= 批量操作 =================
  var ACTION_LABEL = { like: '收藏', unlike: '取消收藏', white: '加入白名单', block: '加入黑名单', delete: '删除' };
  function batchAction(action, items, opts) {
    opts = opts || {};
    if (!items.length) return Promise.resolve();
    var ids = items.map(function (i) { return i.name; });
    toast('正在' + ACTION_LABEL[action] + ' ' + ids.length + ' 个文件…');
    var run = state.batchApi ? viaBatch(action, ids, opts).catch(function (e) {
      if (e && e.fallback) { state.batchApi = false; return viaSingle(action, ids, opts); }
      throw e;
    }) : viaSingle(action, ids, opts);
    return run.then(function (okIds) {
      var ok = {}; okIds.forEach(function (id) { ok[id] = true; });
      if (action === 'delete') {
        state.items = state.items.filter(function (i) { return !ok[i.name]; });
        okIds.forEach(function (id) { state.selected.delete(id); });
      } else {
        items.forEach(function (i) {
          if (!ok[i.name]) return;
          if (action === 'like') i.metadata.liked = true;
          if (action === 'unlike') i.metadata.liked = false;
          if (action === 'white') i.metadata.ListType = 'White';
          if (action === 'block') i.metadata.ListType = 'Block';

      }
      render();

    }).catch(function (e) { toast('操作失败：' + (e && e.message || '网络错误'), true); });
  }
  function viaBatch(action, ids, opts) {

    for (var i = 0; i < ids.length; i += 200) chunks.push(ids.slice(i, i + 200));
    return chunks.reduce(function (p, chunk) {
      return p.then(function () {
        return api('./api/manage/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action, ids: chunk, deleteSource: !!opts.deleteSource }) })
          .then(function (r) {
            if (r.status === 404 || r.status === 405) { var e = new Error('batch unsupported'); e.fallback = true; throw e; }
            return r.json();
          }).then(function (d) {
            if (!d || !Array.isArray(d.results)) { var e = new Error('batch unsupported'); e.fallback = true; throw e; }
            d.results.forEach(function (x) { if (x.ok) okIds.push(x.id); });

  }
  // 回退：使用原有的单文件接口，限制并发
  function viaSingle(action, ids, opts) {

      if (action === 'white' || action === 'block') return './api/manage/' + action + '/' + e;
      return './api/manage/toggleLike/' + e;
    }
    function worker() {
      if (idx >= ids.length) return Promise.resolve();
      var id = ids[idx++], it = byName(id);
      if ((action === 'like' && it && it.metadata.liked) || (action === 'unlike' && it && !it.metadata.liked)) { okIds.push(id); return worker(); }
      return api(path(id)).then(function (r) { if (r.ok) okIds.push(id); }).catch(function () {}).then(worker);
    }

  $('btn-refresh').onclick = function () { reload(); };

  $('copy-sel').onclick = copyTargets;

  $('b-block').onclick = function () { var s = selectedItems(); dialog('加入黑名单', '确定将 ' + s.length + ' 个文件加入黑名单？加入后外链将无法访问。', [{ text: '取消' }, { text: '确定', danger: true, onClick: function () { batchAction('block', s); } }]); };
  $('b-delete').onclick = function () { confirmDelete(selectedItems()); };

  els.list.addEventListener('click', function (e) {
    var sortEl = e.target.closest('[data-sort]');
    if (sortEl) {
      var k = sortEl.dataset.sort, cur = state.sort;
      state.sort = cur.indexOf(k) === 0 ? (/desc$/.test(cur) ? k + '-asc' : k + '-desc') : k + (k === 'name' ? '-asc' : '-desc');

    if (e.target.id === 'cb-page') {
      var ids = Array.prototype.map.call(els.list.querySelectorAll('[data-id]'), function (x) { return x.dataset.id; });

    var it = byName(row.dataset.id); if (!it) return;
    act(a.dataset.act, it, a);
  });
  els.list.addEventListener('change', function (e) { if (e.target.id === 'page-size') { state.pageSize = Number(e.target.value); state.page = 1; persist(); render(); } });


  // ================= 重复文件 =================
  $('btn-dup').onclick = function () {

    var groups = {}; current.forEach(function (i) { groups[i.dupKey] = 1; });

  };
  $('btn-dup-pick').onclick = function () {

  };

  // ================= Lightbox 全屏预览 =================
  var lb = { list: [], i: 0, scale: 1, x: 0, y: 0 };
  function openLightbox(it) {

  }
  function closeLightbox() {

  function lbItem() { return lb.list[lb.i]; }

    else if (it.type === 'video') html = '<video src="' + src + '" controls autoplay playsinline></video>';
    else if (it.type === 'audio') html = '<div class="ph"><svg class="icon"><use href="#i-audio"/></svg><audio src="' + src + '" controls autoplay></audio></div>';
    else html = '<div class="ph"><svg class="icon"><use href="#i-doc"/></svg>该类型不支持预览，可复制或打开链接</div>';
    stage.classList.remove('zoomed'); stage.innerHTML = html;
    $('lb-title').innerHTML = esc(displayName(it)) + '<small>' + fmtSize(it.metadata.fileSize) + ' · ' + fmtTime(it.metadata.TimeStamp) + '</small>';
    $('lb-bot').textContent = (lb.i + 1) + ' / ' + lb.list.length + (it.type === 'image' ? ' · 双击或滚轮缩放，← → 切换' : ' · ← → 切换');

  }
  function lbGo(d) {
    var n = lb.i + d; if (n < 0 || n >= lb.list.length) return;

    lb.i = n; showLb();
  }
  function lbApply() {
    var img = $('lb-stage').querySelector('img'); if (!img) return;

    $('lb-stage').classList.toggle('zoomed', lb.scale > 1);
  }
  function lbZoom(f) { lb.scale = Math.min(8, Math.max(1, lb.scale * f)); if (lb.scale === 1) lb.x = lb.y = 0; lbApply(); }
  $('lb-close').onclick = closeLightbox;
  $('lb-prev').onclick = function () { lbGo(-1); };
  $('lb-next').onclick = function () { lbGo(1); };
  $('lb-copy').onclick = function () { copyText(formatLink(lbItem(), state.fmt)); };
  $('lb-open').onclick = function () { window.open(fileUrl(lbItem()), '_blank', 'noopener'); };
  $('lb-info').onclick = function () { var it = lbItem(); closeLightbox(); openInfo(it); };
  var stageEl = $('lb-stage');
  stageEl.addEventListener('click', function (e) { if (e.target === stageEl) closeLightbox(); });
  stageEl.addEventListener('dblclick', function (e) { if (e.target.tagName === 'IMG') { if (lb.scale > 1) { lb.scale = 1; lb.x = lb.y = 0; lbApply(); } else lbZoom(2.5); } });
  stageEl.addEventListener('wheel', function (e) { if (!stageEl.querySelector('img')) return; e.preventDefault(); lbZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  var drag = null, touchX = null;
  stageEl.addEventListener('pointerdown', function (e) {
    if (e.target.tagName !== 'IMG') return;
    if (lb.scale > 1) { drag = { x: e.clientX - lb.x, y: e.clientY - lb.y }; e.target.setPointerCapture(e.pointerId); }
    else touchX = e.clientX;
  });
  stageEl.addEventListener('pointermove', function (e) { if (!drag) return; lb.x = e.clientX - drag.x; lb.y = e.clientY - drag.y; lbApply(); });
  stageEl.addEventListener('pointerup', function (e) {
    drag = null;
    if (touchX !== null && lb.scale === 1) { var dx = e.clientX - touchX; if (Math.abs(dx) > 60) lbGo(dx < 0 ? 1 : -1); }
    touchX = null;
  });

  // ================= 右键菜单 =================
  var ctx = $('ctx'), ctxItems = [];
  function hideCtx() { ctx.classList.remove('show'); }
  function showCtx(e, it) {
    var multi = state.selected.has(it.name) && state.selected.size > 1;
    ctxItems = multi ? selectedItems() : [it];
    var n = ctxItems.length, b = function (act, icon, label, extra) {
      return '<button data-c="' + act + '"' + (extra || '') + '><svg class="icon"><use href="#' + icon + '"/></svg>' + label + '</button>';
    };
    ctx.innerHTML = (multi ? '<div class="h">已选 ' + n + ' 个文件</div>' : '<div class="h">' + esc(displayName(it)) + '</div>') +
      (multi ? '' : b('preview', 'i-search', '预览', '') + b('open', 'i-open', '新窗口打开')) +
      b('c-url', 'i-copy', '复制 URL') + b('c-markdown', 'i-copy', '复制 Markdown') + b('c-html', 'i-copy', '复制 HTML') + b('c-bbcode', 'i-copy', '复制 BBCode') +
      '<hr>' + b('like', 'i-heart', ctxItems.every(function (i) { return i.metadata.liked; }) ? '取消收藏' : '收藏') +
      (multi ? '' : b('rename', 'i-edit', '重命名')) + b('white', 'i-check', '加入白名单') + b('block', 'i-ban', '加入黑名单') +

  }
  els.list.addEventListener('contextmenu', function (e) {
    var row = e.target.closest('[data-id]'); if (!row) return;
    var it = byName(row.dataset.id); if (!it) return;
    e.preventDefault(); showCtx(e, it);
  });
  ctx.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]'); if (!b) return;
    var c = b.dataset.c, list = ctxItems; hideCtx();
    if (c.indexOf('c-') === 0) {
      var f = c.slice(2); copyText(list.map(function (i) { return formatLink(i, f); }).join('\n'), '已复制 ' + list.length + ' 条 ' + { url: 'URL', markdown: 'Markdown', html: 'HTML', bbcode: 'BBCode' }[f]); return;
    }
    if (c === 'preview') return openLightbox(list[0]);
    if (c === 'open') return window.open(fileUrl(list[0]), '_blank', 'noopener');
    if (c === 'rename') return rename(list[0]);
    if (c === 'like') return list.length === 1 ? toggleLike(list[0]) : batchAction(list.every(function (i) { return i.metadata.liked; }) ? 'unlike' : 'like', list);
    if (c === 'white' || c === 'block') return batchAction(c, list);
    if (c === 'delete') return confirmDelete(list);
  });
  document.addEventListener('click', function (e) { if (!ctx.contains(e.target)) hideCtx(); });
  addEventListener('scroll', hideCtx, true); addEventListener('resize', hideCtx);

  // ================= 框选（桌面端，在列表区域按住拖动） =================
  (function () {
    if (!matchMedia('(pointer: fine)').matches) return;
    var start = null, box = null, base = null, suppress = false;
    els.list.addEventListener('mousedown', function (e) {
      if (e.button !== 0 || e.target.closest('button,input,select,a,video,audio,.pager,.thead')) return;
      start = { x: e.clientX, y: e.clientY }; base = (e.ctrlKey || e.metaKey || e.shiftKey) ? new Set(state.selected) : null;
    });
    addEventListener('mousemove', function (e) {
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!box) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        box = document.createElement('div'); box.className = 'lasso'; document.body.appendChild(box); document.body.classList.add('lassoing');
        if (!base) base = new Set();
      }
      var l = Math.min(e.clientX, start.x), t = Math.min(e.clientY, start.y), r = Math.max(e.clientX, start.x), btm = Math.max(e.clientY, start.y);
      box.style.cssText = 'left:' + l + 'px;top:' + t + 'px;width:' + (r - l) + 'px;height:' + (btm - t) + 'px';
      var next = new Set(base);
      els.list.querySelectorAll('[data-id]').forEach(function (el) {
        var rc = el.getBoundingClientRect(), hit = rc.left < r && rc.right > l && rc.top < btm && rc.bottom > t;
        if (hit) next.add(el.dataset.id);
        el.classList.toggle('sel', next.has(el.dataset.id));
        var cb = el.querySelector('.cb'); if (cb) cb.checked = next.has(el.dataset.id);
      });
      state.selected = next; updateSelection();
    });
    addEventListener('mouseup', function () {
      if (box) { box.remove(); box = null; document.body.classList.remove('lassoing'); suppress = true; syncPageCheckbox(); setTimeout(function () { suppress = false; }, 0); }
      start = null;
    });
    els.list.addEventListener('click', function (e) { if (suppress) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  })();

  // ================= 快捷键 =================
  var KEYS = [['/', '聚焦搜索框'], ['Ctrl / ⌘ + A', '全选当前筛选结果'], ['Esc', '取消选择 / 关闭弹窗'], ['C', '复制选中项（无选中时复制全部结果）'],
    ['Delete', '删除选中项'], ['E', '导出'], ['V', '切换 列表 / 网格 / 瀑布流'], ['D', '查找重复文件'], ['← →', '翻页；预览中切换上一个 / 下一个'], ['?', '显示快捷键']];
  function showKeys() {
    dialog('快捷键', '<div class="keys">' + KEYS.map(function (k) { return '<span><kbd>' + esc(k[0]) + '</kbd></span><span>' + esc(k[1]) + '</span>'; }).join('') +
      '</div><div class="hint" style="margin-top:12px">右键文件可快速复制各种格式；在空白处按住鼠标拖动可框选，按住 Ctrl / ⌘ 追加选择。</div>');
  }
  $('btn-keys').onclick = showKeys;
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if ($('lb').classList.contains('show')) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') lbGo(-1);
      else if (e.key === 'ArrowRight') lbGo(1);
      else if (e.key === 'c' || e.key === 'C') $('lb-copy').click();
      else if (e.key === '+' || e.key === '=') lbZoom(1.25);
      else if (e.key === '-') lbZoom(0.8);
      e.stopImmediatePropagation(); return;
    }
    if (e.key === 'Escape') { hideCtx(); if (!$('mask').classList.contains('show') && state.selected.size) { state.selected.clear(); render(); } return; }
    if (typing || $('mask').classList.contains('show') || e.altKey) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) { e.preventDefault(); $('sel-all').click(); return; }
    if (e.ctrlKey || e.metaKey) return;
    switch (e.key) {
      case 'c': case 'C': copyTargets(); break;
      case 'Delete': case 'Backspace': if (state.selected.size) { e.preventDefault(); confirmDelete(selectedItems()); } break;
      case 'e': case 'E': openExport(); break;
      case 'v': case 'V': state.view = { list: 'grid', grid: 'masonry', masonry: 'list' }[state.view]; persist(); render(); toast({ list: '列表视图', grid: '网格视图', masonry: '瀑布流视图' }[state.view]); break;
      case 'd': case 'D': $('btn-dup').click(); break;
      case '?': showKeys(); break;
      case 'ArrowLeft': case 'ArrowRight':
        var pages = Math.max(1, Math.ceil(current.length / state.pageSize)), np = state.page + (e.key === 'ArrowLeft' ? -1 : 1);
        if (np >= 1 && np <= pages) { state.page = np; render(); }
        break;
    }
  });

  // ================= 外观设置（主题色 / 上传页背景，保存在本浏览器） =================
  var ACCENTS = [['#2f6bff', '默认蓝'], ['#7c4dff', '紫罗兰'], ['#e0457b', '玫红'], ['#f05a28', '橙'], ['#12a37f', '翡翠绿'], ['#0ea5e9', '天蓝'], ['#334155', '石墨']];
  function applyAccent(a) {
    var st = document.documentElement.style;
    if (!a) { ['--accent', '--accent-2', '--accent-soft'].forEach(function (k) { st.removeProperty(k); }); localStorage.removeItem('ti-accent'); return; }
    st.setProperty('--accent', a); st.setProperty('--accent-2', 'color-mix(in srgb, ' + a + ' 78%, #fff)'); st.setProperty('--accent-soft', 'color-mix(in srgb, ' + a + ' 13%, transparent)');
    localStorage.setItem('ti-accent', a);
  }
  $('btn-settings').onclick = function () {
    var cur = localStorage.getItem('ti-accent') || '#2f6bff', bg = localStorage.getItem('ti-front-bg') || 'bing', bgUrl = localStorage.getItem('ti-front-bg-url') || '';
    dialog('外观设置', '<label class="label">主题色（后台与上传页通用）</label><div class="swatches" id="sw">' +
      ACCENTS.map(function (c) { return '<button title="' + c[1] + '" data-c="' + c[0] + '" style="background:' + c[0] + '"' + (c[0] === cur ? ' class="on"' : '') + '></button>'; }).join('') +
      '<input type="color" id="sw-custom" value="' + esc(cur) + '" title="自定义颜色" style="width:32px;height:32px;border:0;padding:0;background:none;cursor:pointer"></div>' +
      '<label class="label" style="margin-top:14px;display:block">上传页背景</label><div class="row" style="gap:8px;flex-wrap:wrap">' +
      '<select class="input" id="bg-mode"><option value="bing">必应每日壁纸（默认）</option><option value="gradient">纯色渐变</option><option value="custom">自定义图片</option></select>' +
      '<input class="input" id="bg-url" style="flex:1;min-width:200px" placeholder="https://… 图片地址" value="' + esc(bgUrl) + '"></div>' +
      '<div class="hint" style="margin-top:10px">设置保存在当前浏览器。若在部署变量中配置了 BACKGROUND_IMAGE，上传页以部署配置为准。</div>',
      [{ text: '恢复默认', onClick: function () { applyAccent(null); localStorage.removeItem('ti-front-bg'); localStorage.removeItem('ti-front-bg-url'); toast('已恢复默认外观'); } },
       { text: '完成', primary: true, onClick: function () {
         var mode = $('bg-mode').value, url = $('bg-url').value.trim();
         if (mode === 'custom' && !/^https?:\/\/|^\//.test(url)) { toast('请填写以 http(s):// 开头的图片地址', true); return false; }
         localStorage.setItem('ti-front-bg', mode); if (url) localStorage.setItem('ti-front-bg-url', url); else localStorage.removeItem('ti-front-bg-url');
         toast('外观已保存');
       } }]);
    $('bg-mode').value = bg;
    $('sw').addEventListener('click', function (e) {
      var b = e.target.closest('[data-c]'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); applyAccent(b.dataset.c); $('sw-custom').value = b.dataset.c;
    });
    $('sw-custom').addEventListener('input', function () { $('sw').querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); }); applyAccent(this.value); });
  };

  // PWA
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(function () {});

  // 主题：自动 → 浅色 → 深色
  var THEMES = ['auto', 'light', 'dark'], THEME_ICON = { auto: 'i-auto', light: 'i-sun', dark: 'i-moon' }, THEME_NAME = { auto: '跟随系统', light: '浅色', dark: '深色' };
  function applyTheme(t) {
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('btn-theme').innerHTML = '<svg class="icon"><use href="#' + THEME_ICON[t] + '"/></svg>';
    $('btn-theme').title = '主题：' + THEME_NAME[t];

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(theme); });
  $('btn-theme').onclick = function () {

  };
  $('btn-logout').onclick = function () { location.href = './api/manage/logout'; };

  // 初始控件状态
  els.sort.value = state.sort; els.unit.value = state.unit; els.preview.checked = state.previewVideo; els.fmt.value = state.fmt;

  // 站点名称
  fetch('/api/config').then(function (r) { return r.ok ? r.json() : null; }).then(function (c) {
    if (c && c.siteName) { $('site-name').textContent = c.siteName; document.title = '文件管理 | ' + c.siteName; }
  }).catch(function () {});

  // 鉴权检查（与原版一致）
  api('./api/manage/check').then(function (r) { return r.text(); }).then(function (t) {
    if (t === 'true') { $('btn-logout').hidden = false; }
    else if (t !== 'Not using basic auth.') { location.href = './api/manage/login'; return; }
  }).catch(function () {});

  render();
  fetchBatch();
})();
